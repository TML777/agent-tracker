<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Agent Tracker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Crect width='1024' height='1024' rx='200' fill='%232F6F62'/%3E%3Crect x='96' y='192' width='832' height='640' rx='112' fill='%23FFFEFB'/%3E%3Ccircle cx='320' cy='512' r='112' fill='%231D8A5F'/%3E%3Cpath d='M544 512H752' fill='none' stroke='%2322221F' stroke-width='128' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <svg width="20" height="20" viewBox="0 0 1024 1024" aria-hidden="true">
            <rect width="1024" height="1024" rx="200" fill="#2F6F62"></rect>
            <rect x="128" y="192" width="768" height="640" rx="96" fill="#FFFEFB"></rect>
            <circle cx="304" cy="384" r="64" fill="none" stroke="#1D8A5F" stroke-width="48"></circle>
            <path d="M448 384H736" fill="none" stroke="#22221F" stroke-width="80" stroke-linecap="round"></path>
            <path d="M272 624H736" fill="none" stroke="#BFBCB1" stroke-width="64" stroke-linecap="round"></path>
          </svg>
          Agent Tracker
        </div>
        <div class="search">
          <input id="search" type="search" placeholder="Search chats and projects" aria-label="Search chats and projects" autocomplete="off" spellcheck="false" />
          <kbd aria-hidden="true">/</kbd>
        </div>
        <nav id="folders" class="folders" aria-label="Folders"></nav>
        <button id="new-project" class="sidebar-action" type="button">+ New project</button>
        <div id="scan-status" class="scan-status" role="status"></div>
      </aside>
      <main class="main">
        <header id="main-header" class="main-header"></header>
        <div id="board" class="board"></div>
      </main>
    </div>
    <aside id="drawer" class="drawer" aria-label="Card details" hidden></aside>
    <dialog id="form-dialog" class="form-dialog"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
